<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAU Hogar y Aromas · Catálogo</title>
  <meta name="description" content="Catálogo de LAU Hogar y Aromas: velas, difusores, sahumerios y artículos para el hogar.">
  <meta property="og:title" content="LAU Hogar y Aromas · Catálogo">
  <meta property="og:description" content="Mirá nuestros catálogos y hacé tu pedido por WhatsApp.">
  <meta name="theme-color" content="#f6efe6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202611082310">
  <link rel="icon" type="image/png" sizes="32x32" href="iconos/icono-32.png">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:url" content="https://lauhogaryaromas.github.io/">
  <meta property="og:image" content="https://lauhogaryaromas.github.io/iconos/icono-512.png">
</head>
<body>
  <header class="top">
    <a href="#/" class="marca">
      <span class="marca-lau">LAU</span>
      <span class="marca-sub">Hogar y Aromas</span>
    </a>
  </header>

  <div id="aviso" class="aviso" hidden></div>
  <main id="app" class="app" aria-live="polite">
    <p class="cargando">Cargando catálogo…</p>
  </main>

  <a id="wa-flotante" class="wa-flotante" hidden target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
  </a>

  <button id="carrito-barra" class="carrito-barra" type="button" hidden>
    <span class="barra-ico" aria-hidden="true">🛍</span>
    <span class="barra-txt"><strong>Ver pedido</strong><span id="barra-cant"></span></span>
    <span id="barra-total" class="barra-total"></span>
  </button>

  <dialog id="carrito" class="carrito" aria-labelledby="carrito-titulo">
    <div class="carrito-cab">
      <h2 id="carrito-titulo">Tu pedido</h2>
      <button type="button" id="carrito-cerrar" class="carrito-x" aria-label="Cerrar">✕</button>
    </div>
    <div class="carrito-cuerpo">
      <ul id="carrito-lista" class="carrito-lista"></ul>
      <div id="carrito-total" class="carrito-total"></div>
      <label class="campo">Aclaraciones <span>(aromas elegidos, colores, etc.)</span>
        <textarea id="carrito-nota" rows="2" placeholder="Ej: Combo 1 en aroma Verbena"></textarea>
      </label>
      <label class="campo">Tu nombre <span>(opcional)</span>
        <input id="carrito-nombre" autocomplete="name">
      </label>
    </div>
    <div class="carrito-pie">
      <a id="carrito-enviar" class="btn-wa grande" href="#" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
      <button type="button" id="carrito-vaciar" class="carrito-vaciar">Vaciar pedido</button>
    </div>
  </dialog>

  <footer class="pie">
    <p>LAU Hogar y Aromas</p>
    <p id="pie-redes"></p>
  </footer>

  <script src="config.js?v=202611082310"></script>
  <script src="app.js?v=202611082310"></script>
</body>
</html>
